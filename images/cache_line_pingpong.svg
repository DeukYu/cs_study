.cv2{opacity:0;animation:cv2 8s linear infinite}
@keyframes cv3{0.00%{opacity:0} 67.49%{opacity:0} 67.50%{opacity:1} 92.49%{opacity:1} 92.50%{opacity:0} 100.00%{opacity:0}}
.cv3{opacity:0;animation:cv3 8s linear infinite}
