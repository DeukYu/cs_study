<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif">
<style>

</style>
<rect x="0" y="0" width="780" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs>
<text x="390.0" y="34" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">Copy-on-Write (쓸 때 복사)</text>
<text x="390.0" y="56" font-size="13" fill="#59636e" text-anchor="middle" font-weight="400">fork 직후에는 페이지를 복사하지 않고 공유하다가, 누군가 쓰는 순간에만 복사합니다</text>
<text x="210" y="92" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">① fork 직후: 같은 프레임 공유</text>
<rect x="40" y="110" width="110" height="44" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="95" y="137" font-size="12" fill="#0969da" text-anchor="middle" font-weight="700">부모 페이지</text>
<rect x="40" y="200" width="110" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<text x="95" y="227" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="700">자식 페이지</text>
<rect x="260" y="150" width="120" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="320" y="170" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">프레임 X</text>
<text x="320" y="186" font-size="10" fill="#59636e" text-anchor="middle" font-weight="400">읽기 전용으로 공유</text>
<line x1="150" y1="132" x2="258" y2="166" stroke="#0969da" stroke-width="2" marker-end="url(#arB)"/>
<line x1="150" y1="222" x2="258" y2="184" stroke="#1a7f37" stroke-width="2" marker-end="url(#arG)"/>
<text x="590" y="92" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">② 자식이 값을 쓰는 순간</text>
<rect x="420" y="110" width="110" height="44" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="475" y="137" font-size="12" fill="#0969da" text-anchor="middle" font-weight="700">부모 페이지</text>
<rect x="420" y="200" width="110" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<text x="475" y="227" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="700">자식 페이지</text>
<rect x="640" y="110" width="120" height="44" rx="6" fill="#ffffff" stroke="#8c959f"/>
<text x="700" y="130" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">프레임 X</text>
<text x="700" y="146" font-size="10" fill="#59636e" text-anchor="middle" font-weight="400">원본</text>
<rect x="640" y="200" width="120" height="44" rx="6" fill="#fff4e5" stroke="#f08c00" stroke-width="2"/>
<text x="700" y="220" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">프레임 Y</text>
<text x="700" y="236" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">새로 복사됨</text>
<line x1="530" y1="132" x2="638" y2="132" stroke="#0969da" stroke-width="2" marker-end="url(#arB)"/>
<line x1="530" y1="222" x2="638" y2="222" stroke="#1a7f37" stroke-width="2" marker-end="url(#arG)"/>
<line x1="395" y1="90" x2="395" y2="260" stroke="#d0d7de" stroke-dasharray="4 4"/>
<text x="390.0" y="285" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">쓰기 시도 → 페이지 폴트 → OS가 그 페이지 하나만 복사해서 자식에게 연결</text>
<text x="390.0" y="308" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">프로세스 생성이 빠르고, 끝까지 안 쓰는 페이지는 복사 비용이 0입니다</text>
</svg>
