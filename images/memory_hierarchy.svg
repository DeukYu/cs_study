<text x="117" y="144" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">~1ns · 코어 전용</text>
<rect x="55" y="164" width="125" height="44" rx="6" fill="#fbefff" stroke="#8250df"/>
