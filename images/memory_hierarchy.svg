<text x="292" y="127" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700">L1 캐시</text>
<text x="292" y="144" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">~1ns · 코어 전용</text>
