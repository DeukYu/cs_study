<text x="380" y="287" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">~10~20ns · 누가 어떤 캐시라인을 갖고 있는지도 여기서 관리 (Snoop Filter)</text>
<line x1="380" y1="299" x2="380" y2="318" stroke="#8c959f" stroke-width="2"/>
<rect x="40" y="318" width="680" height="50" rx="8" fill="#ffebe9" stroke="#cf222e"/>
<text x="380" y="340" font-size="14" fill="#cf222e" text-anchor="middle" font-weight="700">메인 메모리 (RAM)</text>
<text x="380" y="358" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">~80~100ns · 크지만 느림</text>
<text x="40" y="400" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">캐시라인 1개 = 64바이트 = int 16개 자리</text>
