<text x="642" y="97" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">Core 3</text>
<rect x="580" y="108" width="125" height="44" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<text x="642" y="127" font-size="13" fill="#0969da" text-anchor="middle" font-weight="700">L1 캐시</text>
<text x="642" y="144" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">~1ns · 코어 전용</text>
<rect x="580" y="164" width="125" height="44" rx="6" fill="#fbefff" stroke="#8250df"/>
