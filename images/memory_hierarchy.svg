<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif">
<style>

</style>
<rect x="0" y="0" width="760" height="500" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="380.0" y="34" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">CPU 메모리 계층과 캐시라인</text>
<text x="380.0" y="56" font-size="13" fill="#59636e" text-anchor="middle" font-weight="400">코어에 가까울수록 빠르고 작습니다. 데이터는 64바이트 캐시라인 단위로 오갑니다</text>
