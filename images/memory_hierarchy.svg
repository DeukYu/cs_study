<text x="61.25" y="432" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">cnt</text>
<rect x="218.5" y="417" width="365.5" height="20" rx="4" fill="#ffffff"/>
<text x="401.25" y="432" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">← 나머지 60바이트도 같이 묶여서 이동 →</text>
<text x="380" y="480" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">counter(4바이트) 하나만 고쳐도, 64바이트 캐시라인 전체의 소유권이 옮겨 다닙니다</text>
