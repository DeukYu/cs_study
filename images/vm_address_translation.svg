<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',sans-serif">
<style>

</style>
<rect x="0" y="0" width="780" height="500" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs>
<text x="390.0" y="34" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">가상 주소 → 물리 주소 변환 예시 (페이지 4KB)</text>
<text x="390.0" y="56" font-size="13" fill="#59636e" text-anchor="middle" font-weight="400">앞부분(페이지 번호)만 바꾸고, 뒷부분(오프셋)은 그대로 붙입니다</text>
<text x="40" y="92" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">① 프로그램이 쓰는 가상 주소</text>
<rect x="40" y="102" width="150" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="115" y="130" font-size="16" fill="#0969da" text-anchor="middle" font-weight="700">0x00403</text>
<rect x="190" y="102" width="90" height="44" rx="6" fill="#fff4e5" stroke="#f08c00" stroke-width="2"/>
<text x="235" y="130" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="700">A10</text>
<text x="115" y="164" font-size="12" fill="#0969da" text-anchor="middle" font-weight="700">페이지 번호</text>
<text x="235" y="164" font-size="12" fill="#d9480f" text-anchor="middle" font-weight="700">오프셋</text>
<text x="160" y="182" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">(4KB = 2¹² → 끝 12비트 = 16진수 3자리)</text>
<text x="360" y="92" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">② TLB 확인 (최근 변환 메모)</text>
<rect x="360" y="102" width="200" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="380" y="125" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">0x00110</text>
<text x="460" y="125" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">→</text>
<text x="540" y="125" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">0x2C4</text>
<rect x="366" y="132" width="188" height="20" rx="3" fill="#dafbe1"/>
<text x="380" y="147" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">0x00403</text>
<text x="460" y="147" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">→</text>
<text x="540" y="147" font-size="12" fill="#1f2328" text-anchor="end" font-weight="700">0x7F2</text>
<text x="380" y="169" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">0x00521</text>
<text x="460" y="169" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">→</text>
<text x="540" y="169" font-size="12" fill="#59636e" text-anchor="end" font-weight="400">0x0A8</text>
<line x1="282" y1="124" x2="356" y2="124" stroke="#8c959f" stroke-width="2" marker-end="url(#ar)"/>
<text x="600" y="132" font-size="12" fill="#1a7f37" text-anchor="start" font-weight="700">있으면 (TLB Hit)</text>
<text x="600" y="150" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">→ 바로 ④로, 아주 빠름</text>
<text x="392" y="212" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">③ 없으면 (TLB Miss): 페이지 테이블 조회</text>
<line x1="378" y1="184" x2="378" y2="226" stroke="#8c959f" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="360" y="230" width="260" height="126" rx="8" fill="#ffffff" stroke="#8c959f"/>
<text x="380" y="250" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">페이지 번호</text>
<text x="490" y="250" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">프레임</text>
<text x="600" y="250" font-size="11" fill="#59636e" text-anchor="end" font-weight="400">상태</text>
<text x="380" y="273" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0x00401</text>
<text x="490" y="273" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0x1B3</text>
<text x="600" y="273" font-size="12" fill="#1a7f37" text-anchor="end" font-weight="700">v</text>
<text x="380" y="296" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0x00402</text>
<text x="490" y="296" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">-</text>
<text x="600" y="296" font-size="12" fill="#cf222e" text-anchor="end" font-weight="700">i</text>
<rect x="366" y="304" width="248" height="21" rx="3" fill="#dafbe1"/>
<text x="380" y="319" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">0x00403</text>
<text x="490" y="319" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">0x7F2</text>
<text x="600" y="319" font-size="12" fill="#1a7f37" text-anchor="end" font-weight="700">v</text>
<text x="380" y="342" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0x00404</text>
<text x="490" y="342" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">0x0C9</text>
<text x="600" y="342" font-size="12" fill="#1a7f37" text-anchor="end" font-weight="700">v</text>
<text x="640" y="296" font-size="11" fill="#cf222e" text-anchor="start" font-weight="700">i면 페이지 폴트</text>
<text x="640" y="312" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">(디스크에서 가져옴)</text>
<text x="40" y="470" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">④ 물리 주소 (실제 RAM 위치)</text>
<rect x="40" y="402" width="150" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="115" y="430" font-size="16" fill="#1a7f37" text-anchor="middle" font-weight="700">0x007F2</text>
<rect x="190" y="402" width="90" height="44" rx="6" fill="#fff4e5" stroke="#f08c00" stroke-width="2"/>
<text x="235" y="430" font-size="16" fill="#d9480f" text-anchor="middle" font-weight="700">A10</text>
<path d="M360,322 C250,322 140,340 115,398" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#arG)"/>
<path d="M235,148 C235,250 235,330 235,398" fill="none" stroke="#f08c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="244" y="280" font-size="11" fill="#d9480f" text-anchor="start" font-weight="700">오프셋은 그대로</text>
<text x="300" y="430" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">= 0x007F2A10</text>
<text x="300" y="448" font-size="11" fill="#59636e" text-anchor="start" font-weight="400">이 변환은 CPU 안의 MMU가 하드웨어로 처리합니다</text>
</svg>
