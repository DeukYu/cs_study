<text x="390.0" y="519" font-size="12" fill="#cf222e" text-anchor="middle" font-weight="700">디스크 (페이지 파일)</text>
<text x="390.0" y="535" font-size="11" fill="#59636e" text-anchor="middle" font-weight="400">A의 힙: 아직 안 올라옴</text>
<text x="40" y="420" font-size="12" fill="#1a7f37" text-anchor="start" font-weight="700">v = RAM에 있음</text>
<text x="40" y="440" font-size="12" fill="#cf222e" text-anchor="start" font-weight="700">i = RAM에 없음 → 접근 시 페이지 폴트</text>
<text x="590" y="420" font-size="12" fill="#1f2328" text-anchor="start" font-weight="700">같은 0x1000이어도</text>
<text x="590" y="440" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">A는 프레임 5, B는 프레임 3</text>
<text x="390.0" y="580" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">보라색: DLL처럼 읽기 전용인 페이지는 여러 프로세스가 같은 프레임을 공유해서 메모리를 아낍니다</text>
