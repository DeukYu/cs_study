<text x="390.0" y="34" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">프로세스마다 자기만의 주소 공간, 실제 위치는 OS가 관리</text>
<text x="390.0" y="56" font-size="13" fill="#59636e" text-anchor="middle" font-weight="400">A와 B는 같은 가상 주소를 쓰지만, 실제 물리 메모리 위치는 서로 다릅니다</text>
<text x="115.0" y="100" font-size="14" fill="#0969da" text-anchor="middle" font-weight="700">프로세스 A (가상)</text>
<text x="665.0" y="100" font-size="14" fill="#1a7f37" text-anchor="middle" font-weight="700">프로세스 B (가상)</text>
<text x="390.0" y="88" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">물리 메모리 (RAM)</text>
