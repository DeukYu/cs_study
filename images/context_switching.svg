<rect x="20" y="296" width="740" height="54" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="m0" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">스레드 A 실행 중: 게임 데이터를 저장하려고 DB에 쿼리를 보냄</text>
<text class="m1" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">자발적 전환: A가 DB 응답을 기다려야 해서 스스로 CPU를 내놓음 → A 상태 저장, B 상태 복원</text>
<text class="m2" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">스레드 B 시작: 캐시가 식어 있어서 처음엔 느림 (캐시 오염)</text>
<text class="m3" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">스레드 B 실행 중: 게임 로직 계산</text>
<text class="m4" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">DB 응답 도착(인터럽트) → A는 '준비' 상태가 되지만, 코어는 아직 B가 사용 중</text>
<text class="m5" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#8250df">비자발적 전환: B의 타임 슬라이스가 끝나서 OS가 강제로 A로 교체</text>
<text class="m6" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da">스레드 A 실행 중: DB 응답 처리</text>
<text class="m7" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">자발적 전환: A가 다른 스레드가 쥔 락을 기다려야 해서 잠듦</text>
<text class="m8" x="390.0" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">스레드 B 다시 실행</text>
