<rect x="0" y="0" width="760" height="380" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="380.0" y="34" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">스레싱 (Thrashing)</text>
<text x="380.0" y="56" font-size="13" fill="#59636e" text-anchor="middle" font-weight="400">메모리를 더 많이 쓸수록 CPU가 바빠지다가, 한계를 넘으면 페이지 폴트 처리만 하느라 급락합니다</text>
<line x1="80" y1="300" x2="700" y2="300" stroke="#8c959f"/>
<line x1="80" y1="80" x2="80" y2="300" stroke="#8c959f"/>
