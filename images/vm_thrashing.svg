<text x="170" y="200" font-size="13" fill="#0969da" text-anchor="start" font-weight="700">메모리 여유: 잘 돌아감</text>
<text x="562.0" y="140" font-size="14" fill="#cf222e" text-anchor="start" font-weight="700">스레싱 구간</text>
<text x="562.0" y="160" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">페이지를 넣었다 뺐다 반복</text>
<text x="562.0" y="178" font-size="12" fill="#59636e" text-anchor="start" font-weight="400">→ 디스크만 바쁘고 CPU는 대기</text>
<text x="380.0" y="360" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">서버에서 메모리가 부족해 갑자기 극단적으로 느려지면 스레싱을 의심합니다 (작업 관리자의 하드 폴트/초 확인)</text>
