<text x="70" y="300" font-size="11" fill="#59636e" text-anchor="end" font-weight="400">0%</text>
<text x="30" y="190.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">CPU</text>
<text x="30" y="206.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">사용률</text>
<text x="390.0" y="324" font-size="12" fill="#59636e" text-anchor="middle" font-weight="400">동시에 돌리는 프로세스 수 (= 필요한 메모리 양) →</text>
